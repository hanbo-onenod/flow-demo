# Slack app for flow notifications (not AI): the router posts status lines with it.
# Create at https://api.slack.com/apps -> Create New App -> From a manifest.
display_information:
  name: Flow Notifier
  description: Posts task status changes from the flow router. No AI.
features:
  bot_user:
    display_name: flow
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - chat:write.public
settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
